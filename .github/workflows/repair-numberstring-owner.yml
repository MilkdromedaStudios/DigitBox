name: Repair Numberstring Owner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repair existing Numberstring owner claim
        shell: bash
        run: |
          set -euo pipefail
          URL="https://digitbox.pages.dev/api/deepforge/repair-numberstring-owner"
          for i in $(seq 1 90); do
            STATUS="$(curl -sS --max-time 15 -o /tmp/repair.json -w "%{http_code}" -X POST "$URL" || true)"
            BODY="$(cat /tmp/repair.json 2>/dev/null || true)"
            echo "Attempt $i: HTTP $STATUS $BODY"
            if [ "$STATUS" = "200" ]; then
              BODY="$BODY" python3 -c 'import json,os,sys; d=json.loads(os.environ["BODY"]); sys.exit(0 if d.get("ok") is True and d.get("repaired") is True and d.get("username") == "Numberstring" else 1)'
              echo "Numberstring owner claim repaired successfully."
              exit 0
            fi
            sleep 5
          done
          echo "Owner repair did not complete."
          exit 1
