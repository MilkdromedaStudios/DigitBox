name: Install DEEPFORGE World Multiplayer Upgrade

on:
  push:
    paths:
      - .github/workflows/deepforge-world-multiplayer-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch world and game
        run: python3 scripts/patch_deepforge_multiplayer.py
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "DigitBox Builder"
          git config user.email "actions@users.noreply.github.com"
          git add components/deepforge/InfiniteWorld.js components/deepforge/BetaGameV2.js
          git diff --cached --check
          git commit -m "Make DEEPFORGE a walkable multiplayer world"
          git push origin HEAD:main
