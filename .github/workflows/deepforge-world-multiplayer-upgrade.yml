name: Finish DEEPFORGE World Multiplayer Upgrade

on:
  push:
    paths:
      - .github/workflows/deepforge-world-multiplayer-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finish multiplayer cleanup
        run: python3 scripts/patch_deepforge_multiplayer_cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "DigitBox Builder"
          git config user.email "actions@users.noreply.github.com"
          git add pages/api/deepforge/[[...path]].js pages/api/deepforge/admin.js styles/deepforge-beta.css
          git diff --cached --check
          git commit -m "Clean up DEEPFORGE multiplayer account data"
          git push origin HEAD:main
