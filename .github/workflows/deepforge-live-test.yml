name: DEEPFORGE Live Cloud Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepforge-live-cloud-test
  cancel-in-progress: true

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify live Cloudflare D1 auth and R2
        shell: bash
        run: |
          set -euo pipefail
          URL="https://digitbox.pages.dev/v1/health?deep=1"
          echo "Checking $URL"
          for i in $(seq 1 120); do
            BODY="$(curl -sS --max-time 10 "$URL" || true)"
            if BODY="$BODY" python3 - <<'PY'
import json, os, sys
try:
    data = json.loads(os.environ.get('BODY', ''))
except Exception:
    sys.exit(1)
ok = (
    data.get('ok') is True
    and data.get('d1') is True
    and data.get('r2') is True
    and data.get('auth') is True
    and data.get('deep') is True
    and int(data.get('apiVersion', 0)) >= 5
    and data.get('project') == 'digitbox'
)
print(json.dumps(data, sort_keys=True))
sys.exit(0 if ok else 1)
PY
            then
              echo "DEEPFORGE live Cloudflare test passed."
              exit 0
            fi
            echo "Attempt $i: ${BODY:-no response}"
            sleep 5
          done
          echo "::error::DEEPFORGE live Cloudflare test did not pass."
          exit 1
