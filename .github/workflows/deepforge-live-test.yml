name: DEEPFORGE Live Cloud Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Pages production and preview
        shell: bash
        run: |
          set -euo pipefail
          for BASE in "https://digitbox.pages.dev" "https://c99c6fac.digitbox.pages.dev"; do
            echo "===== $BASE/v1/health?deep=1 ====="
            STATUS="$(curl -sS --max-time 20 -o /tmp/body.txt -w "%{http_code}" "$BASE/v1/health?deep=1" || true)"
            echo "HTTP $STATUS"
            head -c 4000 /tmp/body.txt || true
            echo
          done
