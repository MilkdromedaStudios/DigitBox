name: DEEPFORGE Live Cloud Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production game API path
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://digitbox.pages.dev"

          echo "===== $BASE/v1/health ====="
          STATUS="$(curl -sS --max-time 20 -o /tmp/health.txt -w "%{http_code}" "$BASE/v1/health" || true)"
          HEALTH="$(cat /tmp/health.txt 2>/dev/null || true)"
          echo "HTTP $STATUS"
          echo "$HEALTH"
          test "$STATUS" = "200"
          HEALTH="$HEALTH" python3 -c 'import json,os,sys; d=json.loads(os.environ.get("HEALTH","")); sys.exit(0 if d.get("ok") is True and d.get("d1") is True else 1)'

          echo "===== $BASE/api/deepforge/v1/health?deep=1 ====="
          STATUS="$(curl -sS --max-time 20 -o /tmp/deep.txt -w "%{http_code}" "$BASE/api/deepforge/v1/health?deep=1" || true)"
          DEEP="$(cat /tmp/deep.txt 2>/dev/null || true)"
          echo "HTTP $STATUS"
          echo "$DEEP"
          DEEP="$DEEP" python3 -c 'import json,os,sys; d=json.loads(os.environ.get("DEEP","")); ok=(d.get("d1") is True and d.get("auth") is True and int(d.get("apiVersion",0)) >= 6); sys.exit(0 if ok else 1)'

          echo "DEEPFORGE core Cloudflare API is working. R2 status is reported above separately."
