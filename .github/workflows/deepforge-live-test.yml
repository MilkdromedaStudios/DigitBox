name: DEEPFORGE Live Cloud Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepforge-live-cloud-test
  cancel-in-progress: true

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify production DEEPFORGE multiplayer world
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test_deepforge_multiplayer.sh
