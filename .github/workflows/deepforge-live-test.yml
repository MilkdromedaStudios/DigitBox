name: DEEPFORGE Live Cloud Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepforge-live-cloud-test
  cancel-in-progress: true

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Cloudflare D1 auth and R2
        shell: bash
        run: |
          set -euo pipefail
          URL="https://digitbox.pages.dev/v1/health?deep=1"
          echo "Checking $URL"
          BODY="$(curl -sS --max-time 20 "$URL")"
          echo "Response: $BODY"
          BODY="$BODY" python3 -c 'import json,os,sys; d=json.loads(os.environ.get("BODY","")); ok=(d.get("ok") is True and d.get("d1") is True and d.get("r2") is True and d.get("auth") is True and d.get("deep") is True and int(d.get("apiVersion",0)) >= 5 and d.get("project") == "digitbox"); sys.exit(0 if ok else 1)'
          echo "DEEPFORGE live Cloudflare test passed."
