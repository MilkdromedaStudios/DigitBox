name: Fix DEEPFORGE bridge drop-through

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-deepforge-bridge-pass-through.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch one-way bridge collision
        run: python3 scripts/patch_bridge_dropthrough.py
      - name: Verify source
        run: |
          grep -q 'function bridgeLandingAt' components/deepforge/InfiniteWorld.js
          grep -q 'dropThroughBridge = inputY > 0.42' components/deepforge/InfiniteWorld.js
          grep -q 'Bridges are not solid terrain' components/deepforge/InfiniteWorld.js
      - name: Typecheck
        run: |
          npm ci
          npm run typecheck
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/deepforge/InfiniteWorld.js
          if git diff --cached --quiet; then
            echo 'Bridge fix already applied.'
            exit 0
          fi
          git commit -m 'Make bridges one-way drop-through platforms'
          git push
