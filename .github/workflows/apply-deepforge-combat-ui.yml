name: Apply DEEPFORGE Combat UI

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-deepforge-combat-ui.py
      - .github/workflows/apply-deepforge-combat-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-deepforge-combat-ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/deepforge/BetaGameV2.js components/deepforge/InfiniteWorld.js pages/api/deepforge/[[...path]].js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add night zombies, sword PvP, held E digging, and secure account saves"
            git push
          fi
