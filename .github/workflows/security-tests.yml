name: Account security tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  account-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:security
