<!doctype html>
<html lang="en" style="width:100%;height:100%;background:#000">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Eaglercraft · DigitBox</title>
<style>html,body,#game_frame,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#07111f;color:#eef7ff;font:15px system-ui,sans-serif;z-index:20}#boot>div{max-width:560px;padding:24px;text-align:center}.muted{color:#9fb1c7;line-height:1.55}.back{display:inline-block;margin-top:14px;color:#75e9ff;text-decoration:none}</style></head>
<body><div id="game_frame"></div><div id="boot"><div><strong id="status">Starting Eaglercraft…</strong><p class="muted" id="detail">Loading game files from DigitBox.</p><a class="back" href="/projects/eaglercraft-launcher">← Back to launcher</a></div></div>
<script>(()=>{'use strict';
const ROOT='/api/project-file/Eaglercraft-Launcher-main/mc/';
const id=new URLSearchParams(location.search).get('v')||'';
const specs={
'1.12.2':{kind:'x112',scripts:['classes.js'],asset:'assets.epk'},'1.12.2-wasm':{kind:'x112',scripts:['bootstrap.js'],asset:'assets.epw'},
'1.8.8':{kind:'x188',scripts:['classes.js'],asset:'assets.epk',locales:'lang/'},'1.8.8-wasm':{kind:'x188',scripts:['bootstrap.js'],asset:'assets.epw'},
'1.6.4':{kind:'legacy',scripts:['classes.js','eagswebrtc.js'],asset:'assets.epk'},'1.5.2':{kind:'legacy',scripts:['classes.js','eagswebrtc.js'],asset:'assets.epk'},
'1.2.5':{kind:'assets',scripts:['classes.js'],asset:'assets.epk'},'b1.7.3':{kind:'old',scripts:['js/app.js'],asset:'resources.mc'},'b1.4':{kind:'generic',scripts:['classes.js'],asset:'assets.epk'},'b1.3':{kind:'minecraft',scripts:['classes.js'],asset:'assets.epk'},'b1.1':{kind:'generic',scripts:['classes.js'],asset:'assets.epk'},
'a1.2.6':{kind:'old',scripts:['js/app.js'],asset:'resources.mc'},'a1.1.2':{kind:'generic',scripts:['classes.js'],asset:'assets.epk'},'infdev':{kind:'generic',scripts:['classes.js'],asset:'assets.epk'},'infdev-wasm':{kind:'x188',scripts:['bootstrap.js'],asset:'assets.epw'},'indev':{kind:'classic',scripts:['app.js'],asset:'resources.mc'},'c0.30':{kind:'generic',scripts:['classes.js'],asset:'assets.epk'},'c0.30-wasm':{kind:'x188',scripts:['bootstrap.js'],asset:'assets.epw'},
'astraclient':{kind:'x188',scripts:['classes.js'],asset:'assets.epk',locales:'lang/'},
'eaglerforge':{kind:'x188',scripts:['ModAPI.js','ModLoader.js','ModGUI.js','classes.js'],asset:'assets.epk',locales:'lang/'},
'shadowclient':{kind:'x188',scripts:['classes.js'],asset:'assets.epk',locales:'lang/'}
};
const spec=specs[id],boot=document.getElementById('boot'),status=document.getElementById('status'),detail=document.getElementById('detail');
if(!spec){status.textContent='Unknown Eaglercraft build';detail.textContent='Return to the launcher and choose a listed local build.';return}
const base=ROOT+id+'/';document.title='Eaglercraft '+id+' · DigitBox';
function fail(m){status.textContent='Could not start '+id;detail.textContent=m||'A required local file failed to load.';boot.style.display='grid'}
function loadScript(p){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=base+p;s.async=false;s.onload=ok;s.onerror=()=>no(new Error(p));document.head.appendChild(s)})}
function serverQuery(o){const s=new URLSearchParams(location.search).get('server');if(s)o.joinServer=s}
function relay(asset){const r=Math.floor(Math.random()*3);return{demoMode:false,container:'game_frame',assetsURI:asset,worldsDB:'worlds',servers:[],relays:[{addr:'wss://relay.deev.is/',comment:'relay #1',primary:r===0},{addr:'wss://relay.lax1dude.net/',comment:'relay #2',primary:r===1},{addr:'wss://relay.shhnowisnottheti.me/',comment:'relay #3',primary:r===2}]}}
function configure(){const asset=base+spec.asset;
if(spec.kind==='x112'){window.eaglercraftXOpts={demoMode:false,container:'game_frame',assetsURI:asset,worldsDB:'worlds',servers:[]};serverQuery(window.eaglercraftXOpts);return}
if(spec.kind==='x188'){window.eaglercraftXOpts=relay(asset);if(spec.locales)window.eaglercraftXOpts.localesURI=base+spec.locales;serverQuery(window.eaglercraftXOpts);return}
if(spec.kind==='legacy'){window.eaglercraftOpts={container:'game_frame',assetsURI:asset,serverWorkerURI:base+'worker_bootstrap.js',worldsFolder:'MAIN'};serverQuery(window.eaglercraftOpts);return}
if(spec.kind==='generic'){window.eaglercraftXOpts={container:'game_frame',assetsURI:asset,serverWorkerURI:base+'worker_bootstrap.js',worldsFolder:'MAIN'};serverQuery(window.eaglercraftXOpts);return}
if(spec.kind==='assets'){window.assetsURI=asset;return}
if(spec.kind==='minecraft'){window.minecraftOpts=['game_frame',asset,location.origin];return}
if(spec.kind==='old'){document.getElementById('game_frame').id='game';window.config={gameContainer:'game',assetsLocation:asset,playerUsername:null,serverIP:null,joinServerOnLaunch:false};return}
if(spec.kind==='classic')window.classicConfig=['game_frame',asset]}
(async()=>{try{status.textContent='Loading '+id+'…';for(const s of spec.scripts)await loadScript(s);configure();if(typeof window.main!=='function')throw new Error('game entry function');boot.style.display='none';window.main()}catch(e){fail('Failed while loading '+(e&&e.message?e.message:'a required file')+'.')}})();
})();</script></body></html>
